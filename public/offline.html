<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>You’re offline · Campus Copilot</title>
    <style>
      :root{font-family:Inter,system-ui,sans-serif;color:#0f172a;background:#f8fafc}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}.card{width:min(100%,420px);padding:32px;border:1px solid #e2e8f0;border-radius:18px;background:#fff;text-align:center}.icon{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 20px;border-radius:16px;background:#eff6ff;color:#2563eb;font-size:26px}h1{margin:0;font-size:24px}p{margin:12px 0 24px;color:#475569;line-height:1.6}button{border:0;border-radius:10px;padding:12px 18px;background:#2563eb;color:#fff;font:inherit;font-weight:600;cursor:pointer}button:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">⌁</div>
      <h1>You’re offline</h1>
      <p>Campus Copilot can’t connect right now. Check your connection and try again. Previously opened pages may still be available.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
